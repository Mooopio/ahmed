<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Powered Executive Operating System — CNC & Industrial Equipment</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f4f3f1; --panel:#ffffff; --ink:#1c1c1c; --sub:#5c5c58;
  --line:#e3e1dc; --charcoal:#232323; --accent:#d9791f; --accent2:#b85f10;
  --ok:#4a7c4e; --warn:#b8860b; --crit:#b3402f;
  --radius:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --bg2:#1d1d1c; --panel:#201f1e; --ink:#f2f1ee; --sub:#a8a49c;
    --line:#38362f; --charcoal:#0f0f0e;
  }
}
:root[data-theme="dark"]{
  --bg:#161615; --bg2:#1d1d1c; --panel:#201f1e; --ink:#f2f1ee; --sub:#a8a49c;
  --line:#38362f; --charcoal:#0f0f0e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;font-weight:600;margin:0 0 .4em;letter-spacing:.2px;}
a{color:inherit;}
.layout{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:270px;flex:0 0 270px;background:var(--charcoal);color:#eee;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;padding:18px 0 40px;z-index:50;transition:transform .25s;}
#sidebar .brand{padding:0 18px 14px;border-bottom:1px solid #3a3a38;margin-bottom:10px;}
#sidebar .brand small{color:var(--accent);letter-spacing:1px;text-transform:uppercase;font-size:10.5px;}
#sidebar .brand div{font-family:Georgia,serif;font-size:15px;line-height:1.3;margin-top:4px;}
#navSearch{width:calc(100% - 24px);margin:8px 12px 10px;padding:8px 10px;border-radius:8px;border:1px solid #444;background:#2a2a28;color:#eee;font-size:13px;}
#nav{list-style:none;margin:0;padding:0;}
#nav li a{display:block;padding:7px 18px;font-size:13px;color:#c9c7c1;text-decoration:none;border-left:3px solid transparent;cursor:pointer;}
#nav li a:hover{background:#2c2c2a;color:#fff;}
#nav li a.active{background:#2c2c2a;color:var(--accent);border-left-color:var(--accent);font-weight:600;}
#nav li.hidden{display:none;}

/* MAIN */
#main{margin-left:270px;flex:1;min-width:0;}
#topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;gap:12px;align-items:center;z-index:40;padding-top:calc(10px + env(safe-area-inset-top,0px));flex-wrap:wrap;}
#topbar input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink);font-size:13.5px;}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--sub);white-space:nowrap;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
#counter{font-size:11.5px;color:var(--sub);white-space:nowrap;}
#menuBtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);}
.content{padding:32px 40px 90px;max-width:1080px;}
section.page{display:none;}
section.page.active{display:block;animation:fade .25s;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.eyebrow{color:var(--accent2);text-transform:uppercase;font-size:11px;letter-spacing:1.5px;font-weight:700;margin-bottom:8px;}
.lede{color:var(--sub);font-size:15px;line-height:1.6;max-width:760px;margin-bottom:22px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.req{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden;}
.req summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:baseline;font-size:13.5px;}
.req summary::-webkit-details-marker{display:none;}
.req summary .id{font-family:ui-monospace,Consolas,monospace;color:#fff;background:var(--charcoal);padding:2px 7px;border-radius:5px;font-size:11px;flex:none;}
.req summary .nm{font-weight:600;}
.req .body{padding:0 14px 13px 14px;color:var(--sub);font-size:13.5px;line-height:1.55;border-top:1px dashed var(--line);margin-top:2px;padding-top:9px;}
.req[open] summary{border-bottom:1px solid var(--line);}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0;}
.flow .node{background:var(--charcoal);color:#fff;padding:9px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;border:2px solid transparent;}
.flow .node:hover,.flow .node.sel{border-color:var(--accent);}
.flow .arrow{color:var(--sub);font-size:14px;}
.flowdesc{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--sub);margin:6px 0 18px;display:none;}
.flowdesc.show{display:block;}
table.matrix{width:100%;border-collapse:collapse;font-size:12.5px;margin:14px 0;}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:7px 9px;text-align:center;}
table.matrix th{background:var(--bg2);}
table.matrix td:first-child,table.matrix th:first-child{text-align:left;font-weight:600;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;}
.role-select{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.role-select button{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:12.5px;cursor:pointer;}
.role-select button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.role-panel{display:none;}
.role-panel.active{display:block;}
.tag-line{margin-top:10px;font-size:12px;color:var(--sub);}
.tag-line b{color:var(--ink);}
.rule{border-left:4px solid var(--accent);background:var(--bg2);padding:11px 14px;border-radius:6px;font-size:13.5px;margin:10px 0;}
.ai-demo{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg2);}
.ai-demo .q{display:inline-block;margin:3px 5px 3px 0;padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:12.5px;cursor:pointer;}
.ai-demo .ans{margin-top:12px;padding:12px;background:var(--panel);border-radius:8px;border:1px solid var(--line);font-size:13.5px;display:none;}
.ai-demo .ans.show{display:block;}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:12px;background:var(--line);color:var(--sub);margin-right:5px;}
.arch{white-space:pre;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;background:var(--charcoal);color:#eee;padding:18px;border-radius:10px;overflow-x:auto;}
.arch span{cursor:pointer;text-decoration:underline dotted;}
.arch span:hover{color:var(--accent);}
#toTop{position:fixed;bottom:20px;right:20px;background:var(--charcoal);color:#fff;border:none;border-radius:50%;width:42px;height:42px;cursor:pointer;display:none;z-index:60;font-size:16px;}
.no-results{color:var(--sub);font-style:italic;padding:20px 0;}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);width:82%;max-width:300px;}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.3);}
  #main{margin-left:0;}
  #menuBtn{display:inline-block;}
  .content{padding:22px 16px 90px;}
}
</style>
</head>
<body>
<div class="layout">
<nav id="sidebar">
  <div class="brand"><small>Graduation Project</small><div>AI-Powered Executive Operating System<br>for CNC &amp; Industrial Equipment</div></div>
  <input id="navSearch" type="text" placeholder="Filter sections…">

</nav>

<div id="main">

    <button id="menuBtn" aria-label="Menu">☰</button>

    <span id="counter"></span>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<button id="toTop">↑</button>

/* ---------------- FLOW DEFINITIONS (id -> {steps, desc}) ---------------- */
const FLOWS = {
coreflow:{steps:["Data","Understand","Analyze","Detect","Predict","Decide","Act","Follow Up","Verify","Close"],
 desc:{Data:"Company information enters from every department.",Understand:"The platform interprets what the data represents.",Analyze:"AI agents analyze patterns across departments.",Detect:"Problems, risks and opportunities are identified.",Predict:"ML models forecast selected risks.",Decide:"The Decision Engine checks rules, policy and permissions.",Act:"Authorized actions are executed via the Action Engine.",["Follow Up"]:"Tasks are monitored and escalated if overdue.",Verify:"Completion evidence is checked.",Close:"The item is closed and logged to the audit trail."}},
dataflow:{steps:["Data Source","Import","Validation","Missing-Data Detection","Duplicate Detection","Cleaning","Transformation","Synchronization","Central Data Platform"],desc:{}},
leadflow:{steps:["New","Contacted","Qualified","Quotation Sent","Negotiation","Won/Lost"],desc:{}},
pmflow:{steps:["Machine Age + Usage + History","ML Model","Failure Risk","Supporting Factors","Maintenance Recommendation"],desc:{}},
logflow:{steps:["Shipment Delay","Machine Unavailable","Delivery Risk","Installation Risk"],desc:{}},
meetflow:{steps:["Meeting","Notes","Decision","Task","Responsible Person","Deadline","Follow-up","Escalation","Completion"],desc:{}},
admflow:{steps:["Employee Request","Validation","Admin Manager Review","Approve/Reject","Task Creation","Execution","Verification","Close","Notify Employee"],desc:{}},
bonflow:{steps:["Bonus Policy","Eligibility","Calculation","Explanation","Manager Approval"],desc:{}},
rcaflow:{steps:["Shipment Delay","Machine Unavailable","Delivery Delay","Installation Delay","Customer Impact","Potential Payment Risk"],desc:{}},
actflow:{steps:["Detection","Task","Assignment","Deadline","Notification","Monitoring","Escalation","Verification","Closure"],desc:{}},
ragflow:{steps:["Document Upload","Processing","Content Extraction","Indexing","Semantic Search","Retrieval","Grounded Answer","Source Reference"],desc:{}},
mlflow:{steps:["Training Data","Train/Test Split","Model Training","Evaluation","Model Version","Prediction","Timestamp","Stored Output"],desc:{}},
e2ecnc:{steps:CNC_FLOW,desc:CNC_FLOW_DESC},
e2eops:{steps:OPS_FLOW,desc:OPS_FLOW_DESC},
e2escen:{steps:SCENARIO_FLOW,desc:SCEN_DESC},
};
function buildFlows(){
  Object.entries(FLOWS).forEach(([id,cfg])=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML=cfg.steps.map((s,i)=>(i>0?'<span class="arrow">→</span>':'')+`<span class="node" data-flow="${id}" data-step="${s.replace(/"/g,'&quot;')}">${s}</span>`).join('');
  });
  document.addEventListener('click',e=>{
    const n=e.target.closest('.node');
    if(!n)return;
    const flowId=n.dataset.flow, step=n.dataset.step;
    document.querySelectorAll(`[data-flow="${flowId}"]`).forEach(x=>x.classList.remove('sel'));
    n.classList.add('sel');
    const descEl=document.getElementById(flowId+'desc');
    if(descEl){
      const d=(FLOWS[flowId].desc||{})[step];
      descEl.textContent = d || `${step}: part of this workflow stage.`;
      descEl.classList.add('show');
    }
  });
}

/* ---------------- NAV + RENDER ---------------- */
const contentEl=document.getElementById('content');
const navEl=document.getElementById('nav');
SECTIONS.forEach(s=>{
  const li=document.createElement('li');
  li.innerHTML=`<a data-id="${s.id}">${s.title}</a>`;
  navEl.appendChild(li);
  const sec=document.createElement('section');
  sec.className='page'; sec.id='page-'+s.id;
  contentEl.appendChild(sec);
});
function showSection(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('active'));
  const page=document.getElementById('page-'+id);
  const s=SECTIONS.find(x=>x.id===id);
  if(!page||!s)return;
  if(!page.dataset.built){ page.innerHTML=s.render(); page.dataset.built='1'; }
  page.classList.add('active');
  const link=document.querySelector(`#nav a[data-id="${id}"]`);
  if(link)link.classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
  if(id==='overview')buildFlows();
  if(id==='roles')buildRoles();
  if(id==='rbac')buildMatrix();
  if(['data','sales','salesmgr','predmaint','logistics','eom','admin','bonus','rca','action','rag','ml','e2e'].includes(id))buildFlows();
  if(id==='architecture')buildArch();
  if(['salesmgr','aiexec'].includes(id))buildAI();
  if(window.innerWidth<=900){document.getElementById('sidebar').classList.remove('open');}
}
navEl.addEventListener('click',e=>{const a=e.target.closest('a');if(a)showSection(a.dataset.id);});

/* Roles */
function buildRoles(){
  const sel=document.getElementById('roleSelect');
  const panels=document.getElementById('rolePanels');
  if(!sel||sel.dataset.built)return;
  sel.dataset.built='1';
  sel.innerHTML=ROLES.map((r,i)=>`<button data-i="${i}" class="${i===0?'active':''}">${r[0]}</button>`).join('');
  panels.innerHTML=ROLES.map((r,i)=>`<div class="role-panel ${i===0?'active':''}" data-i="${i}">
    <div class="grid">
    <div class="card"><b>Dashboard</b><p style="font-size:12.5px;color:var(--sub)">${r[1]}</p></div>
    <div class="card"><b>Data Visibility</b><p style="font-size:12.5px;color:var(--sub)">${r[2]}</p></div>
    <div class="card"><b>Available Actions</b><p style="font-size:12.5px;color:var(--sub)">${r[3]}</p></div>
    <div class="card"><b>Approval Authority</b><p style="font-size:12.5px;color:var(--sub)">${r[4]}</p></div>
    <div class="card"><b>KPIs</b><p style="font-size:12.5px;color:var(--sub)">${r[5]}</p></div>
    <div class="card"><b>AI Capabilities</b><p style="font-size:12.5px;color:var(--sub)">${r[6]}</p></div>
    </div></div>`).join('');
  sel.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    sel.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    panels.querySelectorAll('.role-panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    panels.querySelector(`.role-panel[data-i="${b.dataset.i}"]`).classList.add('active');
  });
}
/* Matrix */
function buildMatrix(){
  const t=document.getElementById('matrixTable');
  if(!t||t.dataset.built)return; t.dataset.built='1';
  const roles=["CEO","Sales Mgr","Finance Mgr","HR Mgr","Ops Mgr","Technician","AI System"];
  const cols=["View","Create","Update","Approve","Execute"];
  const perm={"CEO":[1,1,1,1,1],"Sales Mgr":[1,1,1,0,1],"Finance Mgr":[1,1,1,1,0],"HR Mgr":[1,1,1,0,0],"Ops Mgr":[1,1,1,0,1],"Technician":[1,0,1,0,0],"AI System":[1,1,0,0,1]};
  t.innerHTML=`<tr><th>Role</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>`+
    roles.map(r=>`<tr><td>${r}</td>${perm[r].map(v=>`<td>${v?'<span class="dot"></span>':'—'}</td>`).join('')}</tr>`).join('');
}
/* Arch */
function buildArch(){
  const box=document.getElementById('archBox');
  if(!box||box.dataset.wired)return; box.dataset.wired='1';
  box.addEventListener('click',e=>{
    const s=e.target.closest('span[data-k]'); if(!s)return;
    const d=document.getElementById('archdesc');
    d.textContent=ARCH_DESC[s.dataset.k]||'';
    d.classList.add('show');
  });
}
/* AI demo */
function buildAI(){
  document.querySelectorAll('.ai-demo .q').forEach(q=>{
    if(q.dataset.wired)return; q.dataset.wired='1';
    q.addEventListener('click',()=>{
      const i=q.dataset.i, set=q.dataset.set;
      const ans=document.getElementById(set==='exec'?'execAns':'smAns');
      if(ans){ans.textContent=AI_QA[i][1]; ans.classList.add('show');}
    });
  });
}

/* ---------------- SEARCH / FILTER ---------------- */
document.getElementById('navSearch').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('#nav li').forEach(li=>{
    const txt=li.textContent.toLowerCase();
    li.classList.toggle('hidden', q && !txt.includes(q));
  });
});
const gs=document.getElementById('globalSearch');
gs.addEventListener('input',()=>{
  const q=gs.value.trim().toLowerCase();
  // Build every section so search can scan them
  SECTIONS.forEach(s=>{const p=document.getElementById('page-'+s.id); if(!p.dataset.built){p.innerHTML=s.render();p.dataset.built='1';}});
  if(!q){ updateCounter(); document.querySelectorAll('.no-results').forEach(n=>n.remove()); document.querySelectorAll('.page').forEach(p=>p.style.display=''); return; }
  let total=0, matchSections=0;
  document.querySelectorAll('.page').forEach(p=>{
    let found=0;
    p.querySelectorAll('.req, .card').forEach(el=>{
      const show=el.textContent.toLowerCase().includes(q);
      el.style.display= show?'':'none';
      if(show)found++;
    });
    total+=found;
    if(found>0)matchSections++;
  });
  document.getElementById('counter').textContent=`${total} matches across ${matchSections} sections`;
});
function updateCounter(){
  const allReqs=Object.values(R).reduce((a,b)=>a+b.length,0)+Object.values(NFR).reduce((a,b)=>a+b.length,0)+BR.length;
  document.getElementById('counter').textContent=`${allReqs} requirements documented`;
  document.querySelectorAll('.req, .card').forEach(el=>el.style.display='');
}

/* ---------------- MISC UI ---------------- */
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
window.addEventListener('scroll',()=>{document.getElementById('toTop').style.display=window.scrollY>400?'block':'none';});
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* INIT */
showSection('overview');
updateCounter();
</script>
